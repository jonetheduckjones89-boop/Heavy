version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: medcore123
      POSTGRES_DB: medcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - storage_data:/data/storage
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medcore:medcore123@postgres:5432/medcore
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - STORAGE_DIR=/data/storage
      - DEBUG=True
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q documents
    volumes:
      - .:/app
      - storage_data:/data/storage
    environment:
      - DATABASE_URL=postgresql://medcore:medcore123@postgres:5432/medcore
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - STORAGE_DIR=/data/storage
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  storage_data:
